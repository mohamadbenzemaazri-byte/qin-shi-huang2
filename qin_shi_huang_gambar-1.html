
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qin Shi Huang — Kaisar Pertama Tiongkok</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; line-height: 1.7; }
    header { background: #0f172a; color: white; padding: 24px; text-align: center; }
    main { padding: 20px; max-width: 900px; margin: auto; }
    h2 { color: #0f172a; border-bottom: 2px solid #e5e7eb; padding-bottom: 4px; }
    .card { background: #f9fafb; padding: 16px; border-radius: 14px; margin: 14px 0; border: 1px solid #e5e7eb; }
    .gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:14px; }
    .img-box { background:#fff; border:1px solid #e5e7eb; border-radius:14px; padding:10px; }
    .img-box img { width:100%; border-radius:10px; }
    footer { text-align:center; padding:18px; color:#6b7280; }
  </style>
</head>
<body>
<header>
  <h1>Qin Shi Huang</h1>
  <p>Kaisar Pertama Tiongkok (259–210 SM)</p>
</header>

<main>
  <section class="card">
    <h2>Galeri</h2>
    <p>Gambar yang kamu minta sudah dimasukkan:</p>
    <div class="gallery"></div>
  </section>
</main>

<footer>
  <p>Web belajar — bebas digunakan.</p>
</footer>
</body>
</html>
